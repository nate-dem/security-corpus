[project]
name = "security-corpus"
version = "0.1.0"
description = "Reproducible ingestion and filtering for a cybersecurity mid-training corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.2",
    "ijson==3.5.0",
    "lxml==6.1.0",
    "markdownify==1.2.2",
    "pydantic==2.13.3",
    "pyarrow==23.0.1",
    "pypdf==6.11.0",
    "PyYAML==6.0.3",
    "requests==2.33.1",
    "sickle==0.7.0",
    "tiktoken==0.12.0",
    "xmltodict==1.0.4",
    "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
]
qwen = [
    "huggingface-hub==0.36.0",
    "transformers>=4.51,<5",
    "vllm==0.13.0",
]

[project.scripts]
security-corpus-ingest = "ingest.commands:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "data_quality: tests that run against ingested Parquet output",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ingest = ["assets/*.tiktoken", "assets/*.md"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
