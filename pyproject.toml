[project]
name = "security-corpus"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "ijson",
    "lxml",
    "pydantic",
    "pyarrow",
    "beautifulsoup4",
    "markdownify",
    "tiktoken",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
regmix = [
    "pyyaml",
    "numpy",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "pandas",
]
regmix-train = [
    "pyyaml",
    "numpy",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "pandas",
    "torch",
    "transformers",
    "accelerate",
    "datasets",
]
fineweb = [
    "datatrove[io]",         # streaming ParquetReader + HuggingFace fs support
    "huggingface_hub",
    "datasets",              # CTIBench download (download_ctibench.py) + DSIR target build
    "numpy",                 # DSIRFitter / DSIRScorer vector math
]
youtube = [
    "vllm",                  # GPU batch inference — install on Marlowe only (requires CUDA)
    "huggingface_hub",       # shard download in classify_youtube_videos.py
    "transformers",          # AutoTokenizer for chat template application
]

[tool.pytest.ini_options]
markers = [
    "data_quality: tests that run against ingested Parquet output",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"