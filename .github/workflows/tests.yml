name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' -r scripts/web_semantic/requirements.txt -r scripts/near_dedup/requirements.txt
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -m 'not data_quality'
      - name: Check shell syntax
        run: |
          find scripts -type f \( -name '*.sh' -o -name '*.sbatch' \) -print0 |
            while IFS= read -r -d '' script; do bash -n "$script" || exit 1; done
  huggingface-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r scripts/release/requirements-huggingface.txt pytest==9.0.3
      - run: python -m pytest tests/test_huggingface_package.py tests/test_filtering_supplement.py -q
